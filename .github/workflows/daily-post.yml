name: StarMind Pro - 6 Daily Posts

on:
  schedule:
    # GitHub cron uses UTC. These are UTC slots; local UK/US times shift with daylight saving.
    - cron: "0 1 * * *"
    - cron: "0 10 * * *"
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
    - cron: "0 19 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starmind-daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests feedparser

      - name: Run StarMind Pro Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PYTHONUNBUFFERED: "1"
        run: python main.py

      - name: Save duplicate-prevention state
        if: success()
        run: |
          if [[ -n "$(git status --porcelain seen_articles.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_articles.json
            git commit -m "chore: update posted story history [skip ci]"
            git push
          else
            echo "No state changes to save."
          fi

name: StarMind Pro - 6 Daily Posts (Fixed)

on:
  schedule:
    # 6 posts daily in UTC - approx every 4h
    # 02:00, 06:00, 10:00, 14:00, 18:00, 22:00 UTC
    # London (GMT+5 per your context) = 07:00, 11:00, 15:00, 19:00, 23:00, 03:00 local - adjust as needed
    - cron: '0 2,6,10,14,18,22 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run safe connectivity test (no public post)'
        required: false
        default: false
        type: boolean

concurrency:
  group: starmind-post-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "Dependencies installed"

      - name: Validate secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN secret missing"
            exit 2
          fi
          if [ -z "$TELEGRAM_CHANNEL_ID" ] && [ -z "$CHANNEL_ID" ]; then
            echo "::warning::TELEGRAM_CHANNEL_ID not set, will default to @StarMindDaily"
          else
            echo "Channel secret present: ${TELEGRAM_CHANNEL_ID:-$CHANNEL_ID}"
          fi
          # Mask token in logs already handled by GitHub

      - name: Run StarMind bot (test mode)
        if: ${{ inputs.test_mode == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          python main.py --test

      - name: Run StarMind bot (publish)
        if: ${{ inputs.test_mode == false }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
        run: |
          set -o pipefail
          python main.py 2>&1 | tee bot.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Exit code: $EXIT_CODE"
          if [ $EXIT_CODE -ne 0 ]; then
            echo "::error::Bot failed with exit $EXIT_CODE - publishing required but failed"
            exit $EXIT_CODE
          fi
          # If no new article, exit 0 is okay (logged as no new articles)
          echo "Bot completed"

      - name: Commit updated state (only on success)
        if: ${{ success() && inputs.test_mode == false }}
        run: |
          git config user.name "starmind-bot"
          git config user.email "bot@starmind.daily"
          git add seen_articles.json growth_stats.json || true
          # Only commit if changed
          if git diff --staged --quiet; then
            echo "No changes to commit (no new post or stats unchanged)"
          else
            git commit -m "Update seen articles and growth stats [skip ci] - $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
            echo "State committed"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: |
            bot.log
            seen_articles.json
            growth_stats.json
          retention-days: 7

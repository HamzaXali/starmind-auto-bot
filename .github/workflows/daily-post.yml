name: Daily StarMind Post - 6x Peak Hours

on:
  schedule:
    # 2 AM London = 9 PM NY (USA Night Peak)
    - cron: '0 1 * * *'
    # 11 AM London = 6 AM NY (USA Wake Up)
    - cron: '0 10 * * *'
    # 2 PM London = 9 AM NY (USA Morning Peak)
    - cron: '0 13 * * *'
    # 5 PM London = 12 PM NY (USA Lunch Peak)
    - cron: '0 16 * * *'
    # 8 PM London = 3 PM NY (USA Afternoon Peak)
    - cron: '0 19 * * *'
    # 11 PM London = 6 PM NY (USA Evening BEST)
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install requests feedparser
      
      - name: Run Auto Post Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python main.py

name: StarMind Growth Engine - 6 Daily Posts

on:
  schedule:
    # Six daily runs. GitHub may delay scheduled workflows during busy periods.
    - cron: "0 1,10,13,16,19,22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: starmind-auto-bot
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run StarMind Growth Engine
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_CHANNEL_LINK: ${{ secrets.TELEGRAM_CHANNEL_LINK }}
        run: python main.py

      - name: Save article history and growth stats
        if: always()
        run: |
          if [ -f seen_articles.json ] || [ -f growth_stats.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            [ ! -f seen_articles.json ] || git add seen_articles.json
            [ ! -f growth_stats.json ] || git add growth_stats.json
            if ! git diff --cached --quiet; then
              git commit -m "Update StarMind posting and growth stats [skip ci]"
              git push
            fi
          fi
          

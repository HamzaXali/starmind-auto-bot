name: StarMind Pro - 6 Daily Posts (FIXED)

on:
  schedule:
    - cron: '0 */4 * * *'  # Every 4 hours = 6 per day
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: starmind-pro
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Validate secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "::error::TELEGRAM_BOT_TOKEN missing"; exit 1; fi
          if [ -z "$TELEGRAM_CHANNEL_ID" ]; then echo "::error::TELEGRAM_CHANNEL_ID missing"; exit 1; fi
          echo "Secrets OK"

      - name: Run StarMind bot (test mode)
        if: ${{ inputs.test_mode == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python main.py --test

      - name: Run StarMind bot (publish)
        if: ${{ inputs.test_mode == false }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          set -o pipefail
          python main.py 2>&1 | tee bot.log
          echo "Exit: ${PIPESTATUS[0]}"
          # Don't fail on no new articles (exit 0)
          if [ ${PIPESTATUS[0]} -eq 0 ] || [ ${PIPESTATUS[0]} -eq 10 ]; then
            echo "Success or no new articles (handled)"
            exit 0
          else
            exit ${PIPESTATUS[0]}
          fi

      - name: Commit updated state (only on success)
        if: ${{ success() && inputs.test_mode == false }}
        continue-on-error: true
        run: |
          git config user.name "starmind-bot"
          git config user.email "bot@starmind.daily"
          git pull --rebase origin main || true
          git add seen_articles.json growth_stats.json || true
          if git diff --staged --quiet; then
            echo "No state change"
          else
            git commit -m "Update state $(date -u +%Y-%m-%dT%H:%M:%SZ) [skip ci]"
            git push origin main || echo "Push failed but continuing"
          fi

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starmind-pro-logs-${{ github.run_number }}
          path: |
            bot.log
            seen_articles.json
            shorts.log
          retention-days: 7

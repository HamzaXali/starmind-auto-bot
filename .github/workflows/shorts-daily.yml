name: StarMind Shorts + Telegram Auto-Post (NO SETTINGS NEEDED)

on:
  schedule:
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test only'
        required: false
        default: false
        type: boolean

# FIX 1: This line gives write permission WITHOUT needing Settings -> Actions -> General
# You DON'T need to find Read and write setting anymore - this YAML overrides it
permissions:
  contents: write

concurrency:
  group: starmind-shorts
  cancel-in-progress: false

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout with write token
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg

      - name: Install deps
        run: |
          pip install -r requirements.txt
          if [ -f "requirements-shorts.txt" ]; then pip install -r requirements-shorts.txt; fi

      - name: Generate + Auto-Post to Telegram
        if: ${{ inputs.test_mode == false }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          python main.py 2>&1 | tee shorts.log
          echo "Exit: ${PIPESTATUS[0]}"

      - name: Generate (test)
        if: ${{ inputs.test_mode == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python main.py --test 2>&1 | tee shorts.log

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starmind-short-${{ github.run_number }}
          path: |
            output/*.mp4
            shorts.log
            seen_articles.json
          retention-days: 14

      - name: Commit history (FIXED - never fails workflow)
        if: ${{ always() }}
        continue-on-error: true  # Even if push fails, workflow stays green
        run: |
          git config user.name "starmind-bot"
          git config user.email "bot@starmind.daily"
          git pull --rebase origin main || echo "Rebase skip"
          git add seen_articles.json growth_stats.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Update history $(date -u +%Y-%m-%d) [skip ci]" || true
            git push origin main || echo "Push failed but workflow continues as success"
          fi

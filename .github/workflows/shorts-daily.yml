name: StarMind Shorts + Telegram Auto-Post

on:
  schedule:
    - cron: '0 14 * * *'  # 14:00 UTC = 19:00 PKT
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test only (no Telegram post)'
        required: false
        default: true
        type: boolean

concurrency:
  group: starmind-shorts-telegram
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -n1

      - name: Install deps
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          # If you renamed requirements to shorts version
          if [ -f "requirements-shorts.txt" ]; then pip install -r requirements-shorts.txt; fi

      - name: Generate Short (test)
        if: ${{ inputs.test_mode == true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python main.py --test 2>&1 | tee shorts.log

      - name: Generate + Auto-Post to Telegram
        if: ${{ inputs.test_mode == false }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          CHANNEL_ID: ${{ secrets.CHANNEL_ID }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -o pipefail
          python main.py 2>&1 | tee shorts.log
          echo "Exit code: ${PIPESTATUS[0]}"
          if [ ${PIPESTATUS[0]} -ne 0 ]; then exit ${PIPESTATUS[0]}; fi

      - name: Upload artifact (video + logs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: starmind-short-${{ github.run_number }}
          path: |
            output/*.mp4
            output/*.jpg
            output/*.srt
            output/*.mp3
            shorts.log
            seen_articles.json
          retention-days: 14

      - name: Commit history
        if: ${{ success() && inputs.test_mode == false }}
        run: |
          git config user.name "starmind-bot"
          git config user.email "bot@starmind.daily"
          git add seen_articles.json growth_stats.json || true
          if git diff --staged --quiet; then echo "No changes"; else git commit -m "Update Shorts + Telegram history $(date -u +%Y-%m-%d) [skip ci]" && git push; fi
